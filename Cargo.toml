[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/domain",
    "crates/download-detector",
    "crates/event-engine",
    "crates/file-watcher",
    "crates/file-operations",
    "crates/storage",
]

[workspace.package]
version = "0.2.5"
edition = "2021"
license = "MIT"
rust-version = "1.75"

# Shared dependency versions. Individual crates opt in with `dep.workspace = true`.
# Exact versions get pinned in Cargo.lock the first time `cargo build` runs
# against the toolchain baseline in docs/architecture.md.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
notify = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64 = "0.22"
