[package]
name = "assetpile"
version.workspace = true
edition.workspace = true
license.workspace = true
# Without this, `cargo run`/`tauri dev` refuses to start ("could not
# determine which binary to run") now that the MSIX packaging pipeline
# added a second [[bin]] target below — this one is the real dev/release
# binary, `AssetPile-MSIX` is packaging-only (see its own comment).
default-run = "assetpile"

[lib]
name = "assetpile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Two bin targets sharing src/main.rs: "assetpile" is the real
# NSIS/MSI/portable release binary. "AssetPile-MSIX" is *not* what the MSIX
# packaging tool (@choochmeque/tauri-windows-bundle) actually expects — it
# derives the executable name from `productName` with spaces stripped
# (`"AssetPile｜材栈"`, unchanged, since it has no ASCII spaces), with no
# config override — but Cargo bin/crate names reject the CJK/pipe
# characters in that string ("invalid character '｜' in crate name"), so an
# exact match isn't possible here. This name is only a placeholder to keep
# the package building; if the MSIX pipeline is used for real, check
# whether the tool needs an exact `AssetPile｜材栈.exe` (in which case the
# built `assetpile.exe` may need a post-build copy/rename step instead of a
# second bin target).
#
# IMPORTANT: on Windows, `cargo build`/`tauri build` compiles every [[bin]]
# target in the package by default, and Windows filesystems are
# case-insensitive — two bin names that differ only by case (e.g. an
# earlier "assetpile"/"AssetPile" pair used here) collide on the same
# output .exe file and the link step fails with LNK1104 ("cannot open file
# ...exe"), which broke the first post-rename CI release build
# (2026-09-15). Whatever this second bin is named, it must not case-fold
# to "assetpile".
[[bin]]
name = "assetpile"
path = "src/main.rs"

[[bin]]
name = "AssetPile-MSIX"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
domain = { path = "../../../crates/domain" }
storage = { path = "../../../crates/storage" }
download-detector = { path = "../../../crates/download-detector" }
event-engine = { path = "../../../crates/event-engine" }
file-watcher = { path = "../../../crates/file-watcher" }
file-operations = { path = "../../../crates/file-operations" }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
image.workspace = true
base64.workspace = true
