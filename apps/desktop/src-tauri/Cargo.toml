[package]
name = "assetpile"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "assetpile"

[lib]
name = "assetpile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The MSIX packaging tool (@choochmeque/tauri-windows-bundle) expects the
# compiled exe to be literally named after `productName` with spaces
# stripped — `AssetPile｜材栈.exe` here — with no config override. Cargo
# rejects the CJK/pipe characters in that string as a `[[bin]]` name
# ("invalid character '｜' in crate name"), so there's no way to make Cargo
# produce that filename directly. A second bin target was tried as a
# workaround (an ASCII approximation that didn't actually match what the
# tool looks for, and which once collided case-insensitively with this one
# on Windows and broke a release build — LNK1104) — removed in favor of the
# post-build copy/rename `build-msix.mjs` now does instead, exactly as
# flagged as the fallback plan in docs/microsoft-store.md.
[[bin]]
name = "assetpile"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
domain = { path = "../../../crates/domain" }
storage = { path = "../../../crates/storage" }
download-detector = { path = "../../../crates/download-detector" }
event-engine = { path = "../../../crates/event-engine" }
file-watcher = { path = "../../../crates/file-watcher" }
file-operations = { path = "../../../crates/file-operations" }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
image.workspace = true
base64.workspace = true
